name: Offline security regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated standard-library tests
        run: python3 -I -S -B run_tests.py
      - name: Whitespace validation
        run: git diff --check
